name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub Pages must be enabled once in Settings -> Pages (Source: GitHub
  # Actions). The token cannot create the site (actions/configure-pages#40),
  # so detect that state up front and skip the deploy instead of failing every
  # push with a red build that is actually unrelated to the code.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          case "${status}" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is configured for this repository."
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              {
                echo "### GitHub Pages is not enabled"
                echo ""
                echo "The dashboard was **not** deployed. Enable it once:"
                echo ""
                echo "**Settings → Pages → Build and deployment → Source: GitHub Actions → Save**"
                echo ""
                echo "Then re-run this workflow (Actions → Deploy dashboard to GitHub Pages → Run workflow)."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Pages lookup failed (HTTP ${status})"
              exit 1
              ;;
          esac

  build:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build dashboard (project-site base path)
        env:
          FLS_BASE: /tree-of-life/
        run: npm run build:web

      - name: SPA fallback (deep links -> index.html)
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: [preflight, build]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
