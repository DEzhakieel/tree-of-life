<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M16 4c3 4 5 8 5 12a5 5 0 1 1-10 0c0-4 2-8 5-12z' fill='%2322c55e'/%3E%3C/svg%3E" />
    <title>Fractal Life Sandbox</title>
    <style>
      #boot-error{display:none;position:fixed;inset:0;z-index:9999;background:#111;color:#f87171;padding:24px;font:13px/1.5 monospace;overflow:auto;white-space:pre-wrap}
    </style>
  </head>
  <body class="h-full bg-black">
    <div id="root" class="h-full"></div>
    <script>
      window.onerror=function(m,s,l,c,e){var d=document.getElementById('boot-error');if(!d){d=document.createElement('div');d.id='boot-error';document.body.appendChild(d)}d.style.display='block';d.innerHTML+='<b>'+m+'</b> ('+s+':'+l+':'+c+')\n'+(e&&e.stack?e.stack:'')+'\n';};
      window.addEventListener('unhandledrejection',function(e){var d=document.getElementById('boot-error');if(!d){d=document.createElement('div');d.id='boot-error';document.body.appendChild(d)}d.style.display='block';d.innerHTML+='<b>Unhandled Promise Rejection:</b> '+(e.reason&&e.reason.message?e.reason.message:String(e.reason))+'\n'+(e.reason&&e.reason.stack?e.reason.stack:'')+'\n';});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
